name: Deploy GREEN to Hoster

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: green-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.GREEN_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - name: Check publication files
        run: python3 .github/hosting/deploy.py --check
      - name: Publish to igra.green-market.by over FTPS
        env:
          GREEN_FTP_HOST: vh167.hoster.by
          GREEN_FTP_USER: h219396_green_actions
          GREEN_FTP_PASSWORD: ${{ secrets.GREEN_FTP_PASSWORD }}
        run: python3 .github/hosting/deploy.py
